<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CATRACHOWEAR | Moda con Identidad Hondureña</title>
  <link rel="stylesheet" href="styles.css">
  <!-- Fuentes Google: Pacifico para el Logo/Categorías y Poppins para el texto general -->
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

  <!-- ENCABEZADO SUPERIOR -->
  <header class="navbar">
    <div class="logo">CATRACHOWEAR</div>
    
    <nav class="nav-links">
      <a href="#inicio" class="active">Inicio</a>
      <a href="#tienda">Tienda</a>
      <a href="#nosotros">Nosotros</a>
      <a href="#ayuda">Ayuda</a>
    </nav>

    <div class="nav-right">
      <a href="#cuenta" class="account-link"><i class="fa-regular fa-user"></i> Cuenta</a>
      <div class="cart-icon" onclick="toggleCarrito()">
        <i class="fa-solid fa-cart-shopping"></i>
        <span id="cart-count" class="badge">0</span>
      </div>
    </div>
  </header>

  <!-- CONTENEDOR PRINCIPAL TIPO TARJETA (Como en la maqueta) -->
  <main class="main-container">
    
    <!-- HERO BANNER PRINCIPAL -->
    <section id="inicio" class="hero-card">
      <div class="hero-overlay"></div>
      <div class="hero-text">
        <h1>MODA CON IDENTIDAD HONDUREÑA</h1>
        <p>Prendas que conectan cultura, orgullo y estilo.</p>
        <a href="#tienda" class="btn-hero">VER COLECCIÓN</a>
      </div>
    </section>

    <!-- SECCIÓN DE CATEGORÍAS PRINCIPALES Y TIENDA -->
    <section id="tienda" class="section-categories-and-products">
      <!-- Tarjetas de Categorías Principales -->
      <div class="categories-grid">
        <div class="category-card">
          <img src="https://images.unsplash.com/photo-1617137984095-74e4e5e3613f?auto=format&fit=crop&w=600&q=80" alt="Hombre">
          <span class="category-title">Hombre</span>
        </div>
        <div class="category-card">
          <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=600&q=80" alt="Mujer">
          <span class="category-title">Mujer</span>
        </div>
        <div class="category-card">
          <img src="https://images.unsplash.com/photo-1544816155-12df9643f363?auto=format&fit=crop&w=600&q=80" alt="Accesorios">
          <span class="category-title">Accesorios</span>
        </div>
      </div>

      <!-- Tarjetas de Productos Rapidos -->
      <div class="products-grid-mini" id="productos-grid">
        <!-- Se cargan dinámicamente desde productos.json o JS -->
      </div>
    </section>

    <!-- FOOTER AZUL INFERIOR -->
    <footer class="footer-bar">
      <a href="#envios">Envíos</a> • 
      <a href="#atencion">Atención</a> • 
      <a href="#redes">Redes</a> • 
      <a href="#privacidad">Privacidad</a> • 
      <a href="#terminos">Términos</a>
    </footer>

  </main>

  <!-- MODAL DE CARRITO -->
  <div id="modal-carrito" class="cart-modal">
    <div class="cart-modal-content">
      <div class="cart-header">
        <h3><i class="fa-solid fa-cart-shopping"></i> Tu Carrito</h3>
        <span class="close-btn" onclick="toggleCarrito()">&times;</span>
      </div>
      <div id="cart-items-container" class="cart-body"></div>
      <div class="cart-footer">
        <div class="summary-row">
          <span>Total:</span>
          <strong id="cart-total">L. 0.00 HNL</strong>
        </div>
        <button class="btn-checkout" onclick="alert('¡Procesando orden con éxito!')">Proceder al Pago</button>
      </div>
    </div>
  </div>

  <script>
    let productos = [];
    let carrito = JSON.parse(localStorage.getItem('cart_cw')) || [];

    // Cargar datos
    fetch('productos.json')
      .then(res => res.json())
      .then(data => {
        productos = data;
        const grid = document.getElementById('productos-grid');
        grid.innerHTML = '';
        productos.slice(0, 4).forEach(p => {
          grid.innerHTML += `
            <div class="product-mini-card">
              <div class="img-box"><img src="${p.imagen}" alt="${p.nombre}"></div>
              <h4>${p.nombre}</h4>
              <p class="price">L. ${p.precio}.00</p>
              <button class="btn-add-mini" onclick="agregarAlCarrito(${p.id})">Añadir al carrito</button>
            </div>
          `;
        });
        actualizarUI();
      }).catch(() => {
        // En caso de que cargue local sin server
        actualizarUI();
      });

    function agregarAlCarrito(id) {
      const prod = productos.find(p => p.id === id);
      if(!prod) return;
      const existe = carrito.find(i => i.id === id);
      if(existe) { existe.cantidad++; } else { carrito.push({...prod, cantidad: 1}); }
      localStorage.setItem('cart_cw', JSON.stringify(carrito));
      actualizarUI();
      toggleCarrito(true);
    }

    function toggleCarrito(abrir = false) {
      const modal = document.getElementById('modal-carrito');
      if(abrir) modal.style.display = 'flex';
      else modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
    }

    function actualizarUI() {
      const count = document.getElementById('cart-count');
      const container = document.getElementById('cart-items-container');
      const totalElem = document.getElementById('cart-total');
      
      let totalItems = 0;
      let totalMonto = 0;
      container.innerHTML = '';

      carrito.forEach(item => {
        totalItems += item.cantidad;
        totalMonto += item.precio * item.cantidad;
        container.innerHTML += `
          <div style="display:flex; justify-between; align-items:center; margin-bottom:10px;">
            <div><strong>${item.nombre}</strong><br><small>L. ${item.precio} x ${item.cantidad}</small></div>
            <button onclick="eliminar(${item.id})" style="color:red; background:none; border:none; cursor:pointer;">&times;</button>
          </div>
        `;
      });

      count.innerText = totalItems;
      totalElem.innerText = `L. ${totalMonto.toFixed(2)} HNL`;
    }

    function eliminar(id) {
      carrito = carrito.filter(i => i.id !== id);
      localStorage.setItem('cart_cw', JSON.stringify(carrito));
      actualizarUI();
    }
  </script>
</body>
</html>
